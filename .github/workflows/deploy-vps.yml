name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.213.19
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/techpub
            git pull origin main
            cd payload
            npm install
            npm run build
            test -f .next/BUILD_ID
            pm2 restart techpub --update-env || pm2 start npm --name "techpub" --cwd /var/www/techpub/payload -- start
            pm2 save
