name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.213.19
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/techpub
            # The CMS runs in dev mode, which regenerates payload/src/payload-types.ts
            # on boot and leaves the tree dirty. `git pull` then aborts as soon as a
            # commit touches that file, so mirror origin/main outright instead of
            # merging into it. Only tracked files are affected: .env and media/ are
            # gitignored and survive untouched.
            git fetch origin main
            git reset --hard origin/main
            cd payload

            # Update .env with deployment-specific variables (preserve existing secrets)
            if [ ! -f .env ]; then
              echo "PAYLOAD_SECRET=techpub-secret-key-super-strong-2025-random-string-for-security" > .env
            fi
            grep -v "^PAYLOAD_PUBLIC_URL=\|^PAYLOAD_DISABLE_CSRF=\|^DEBUG_AUTH=" .env > .env.tmp || true
            mv .env.tmp .env
            echo "DEBUG_AUTH=true" >> .env
            # Must be the canonical HTTPS origin the admin is actually browsed at.
            # Pointing this at the plain-HTTP IP made every absolute URL the admin
            # generated mixed content once the panel was opened over HTTPS, and kept
            # the domain out of payload.config.ts's CORS allow-list.
            echo "PAYLOAD_PUBLIC_URL=https://cms.lbtechpub.com" >> .env
            echo "PAYLOAD_DISABLE_CSRF=true" >> .env

            npm install
            pm2 delete techpub || true
            sleep 2
            pm2 start "npm run dev" --name "techpub" --cwd /var/www/techpub/payload --no-autorestart
            pm2 save
            sleep 5
            pm2 status
