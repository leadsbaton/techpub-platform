name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.213.19
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/techpub
            git pull origin main
            cd payload

            # Update .env with deployment-specific variables (preserve existing secrets)
            if [ ! -f .env ]; then
              echo "PAYLOAD_SECRET=techpub-secret-key-super-strong-2025-random-string-for-security" > .env
            fi
            grep -v "^PAYLOAD_PUBLIC_URL=\|^PAYLOAD_DISABLE_CSRF=\|^DEBUG_AUTH=" .env > .env.tmp || true
            mv .env.tmp .env
            echo "DEBUG_AUTH=true" >> .env
            echo "PAYLOAD_PUBLIC_URL=http://187.127.213.19:5000" >> .env
            echo "PAYLOAD_DISABLE_CSRF=true" >> .env

            npm install
            pm2 delete techpub || true
            sleep 2
            pm2 start "npm run dev" --name "techpub" --cwd /var/www/techpub/payload --no-autorestart
            pm2 save
            sleep 5
            pm2 status
