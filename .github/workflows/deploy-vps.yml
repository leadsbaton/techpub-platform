name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.213.19
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/techpub/payload

            # Create .env with required variables
            cat > .env << 'EOF'
DEBUG_AUTH=true
PAYLOAD_PUBLIC_URL=http://187.127.213.19:5000
PAYLOAD_DISABLE_CSRF=true
NODE_ENV=production
PORT=5000
EOF

            cd /var/www/techpub
            git pull origin main
            cd payload
            npm install
            npm run build
            test -f .next/BUILD_ID
            pm2 delete techpub || true
            sleep 2
            pm2 start "npm start" --name "techpub" --cwd /var/www/techpub/payload
            pm2 save
            sleep 3
            pm2 logs techpub --lines 20
